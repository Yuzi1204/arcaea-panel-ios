name: build-ios-unsigned-ipa

# 在 GitHub 的 macOS runner 上编译 ArcaeaPanel（SwiftUI + WKWebView 外壳），
# 产出一个未签名 .ipa（Payload/ArcaeaPanel.app），由你在 iPad 上自行签名。
#
# 用法：
#   1. Actions 页面点 "Run workflow"
#   2. 构建完成后在 Artifacts 里下载 arcaea-panel-unsigned-ipa
#   3. 用 Sideloadly / ESign / AltStore 自签安装

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          swift --version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate --spec project.yml
          ls -la
          xcodebuild -list -project ArcaeaPanel.xcodeproj

      - name: 编译 Release（跳过签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project ArcaeaPanel.xcodeproj \
            -scheme ArcaeaPanel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: 打包为未签名 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/ArcaeaPanel.app"
          if [ ! -d "$APP" ]; then
            echo "找不到构建产物：$APP"
            find build/Build/Products -maxdepth 3 -name '*.app' || true
            exit 1
          fi
          rm -rf Payload ArcaeaPanel-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/ArcaeaPanel.app
          zip -qry ArcaeaPanel-unsigned.ipa Payload
          echo "--- 产物 ---"
          ls -lh ArcaeaPanel-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' "$APP/Info.plist"
          lipo -info Payload/ArcaeaPanel.app/ArcaeaPanel || true
          unzip -l ArcaeaPanel-unsigned.ipa | head -30

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: arcaea-panel-unsigned-ipa
          path: ArcaeaPanel-unsigned.ipa
          retention-days: 7

      - name: 失败时保留构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
